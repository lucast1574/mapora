version: "3.8"
services:
  engine:
    image: mapora-pmtiles:1.31.2
    command: ["serve", "/data", "--port=8080", "--cache-size=64"]
    volumes:
      - /var/lib/mapora-next/tiles:/data:ro
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/world/0/0/0.mvt"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == rangelserver1]
      resources:
        limits: {cpus: "2", memory: 512M}
      restart_policy: {condition: any, delay: 10s}
  gateway:
    image: caddy@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    volumes:
      - /var/lib/mapora-next/assets:/assets:ro
      - /var/lib/mapora-next/tiles/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/world/0/0/0.mvt"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == rangelserver1]
      resources:
        limits: {cpus: "1", memory: 256M}
      restart_policy: {condition: any, delay: 10s}
networks:
  dokploy-network: {external: true}
