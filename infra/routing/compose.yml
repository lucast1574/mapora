version: "3.8"
services:
  engine:
    # Use the immutable digest recorded after building/smoke-testing the dataset.
    image: ghcr.io/valhalla/valhalla-scripted@sha256:6238809f9dc3057743d70a20efd3911ec38e458bfa13a0601909b58f68dfd956
    entrypoint: ["valhalla_service"]
    command: ["/custom_files/valhalla.json", "2"]
    volumes:
      - /var/lib/mapora-next/routing-v2:/custom_files:ro
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:8002/status > /dev/null"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == rangelserver1]
      resources:
        limits: {cpus: "4", memory: 8G}
        reservations: {memory: 512M}
      restart_policy: {condition: any, delay: 10s}
    stop_grace_period: 60s
networks:
  dokploy-network: {external: true}
