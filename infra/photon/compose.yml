version: "3.8"
services:
  photon:
    image: 192.168.15.8:5005/dokploy/mapora-photon@sha256:2ea34a8702f5c6752d14a856c73e4eb825ad8185c93d127d7a996b246a9ea957
    volumes:
      - /var/lib/mapora-photon/runtime:/data
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == rangelserver1
      resources:
        limits:
          cpus: "4"
          memory: 16G
        reservations:
          memory: 2G
      restart_policy:
        condition: any
        delay: 10s
    stop_grace_period: 120s
networks:
  dokploy-network:
    external: true
