version: "3.8"
services:
  photon:
    image: mapora-photon:1.3.0
    volumes:
      - /var/lib/mapora-photon/runtime:/data
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == rangelserver1
      resources:
        limits:
          cpus: "4"
          memory: 16G
        reservations:
          memory: 2G
      restart_policy:
        condition: any
        delay: 10s
    stop_grace_period: 120s
networks:
  dokploy-network:
    external: true
